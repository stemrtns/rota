<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Analise solicita&#231;&#245;es de aluguel e atualize o status dos contratos." />
    <title>An&#225;lise financeira - Rota</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=1.8.19" />
    <script type="module" src="app.js?v=1.8.19"></script>
  </head>
  <body data-page="analise">
    <div data-layout="header"></div>
    <main>
      <section class="page-section is-active" id="view-analise" data-view="analise">
        <div class="page-banner">
          <div class="container"><span class="eyebrow">Área interna</span><h1>Análise de <span>pedidos.</span></h1><p>Agentes autorizam os pedidos; bancos registram a decisão final do aluguel.</p></div>
        </div>
        <div class="container page-content">
          <div class="analysis-stats" id="analysis-stats"></div>
          <div class="orders-heading"><div id="analysis-summary"></div><div class="status-legend"><span class="status-dot status-pending"></span> Aguardando a etapa do seu perfil</div></div>
          <div class="analysis-list" id="analysis-list"></div>
        </div>
      </section>
    </main>
    <div data-layout="footer"></div>
    <div data-layout="modals"></div>
    <div class="modal-backdrop" id="client-detail-modal" aria-hidden="true">
      <section class="dialog-card client-detail-dialog" role="dialog" aria-modal="true" aria-labelledby="client-detail-title">
        <button class="dialog-close" type="button" data-close-modal aria-label="Fechar cadastro">×</button>
        <span class="eyebrow">CADASTRO DO CLIENTE</span>
        <h2 id="client-detail-title">Dados do cliente</h2>
        <p class="client-detail-intro">Informações fornecidas para a análise do pedido.</p>
        <div id="client-detail-content"></div>
      </section>
    </div>
  </body>
</html>
