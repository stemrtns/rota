<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Explore ve&#237;culos dispon&#237;veis para aluguel e consulte a galeria de fotos." />
    <title>Ve&#237;culos dispon&#237;veis - Rota</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=1.8.17" />
    <script type="module" src="app.js?v=1.8.18"></script>
  </head>
  <body data-page="veiculos">
    <div data-layout="header"></div>
    <main>
      <section class="page-section is-active" id="view-veiculos" data-view="veiculos">
        <div class="page-banner">
          <div class="container"><span class="eyebrow">CATÁLOGO ROTA</span><h1>Veículos <span>disponíveis</span></h1><p>Explore os modelos por estado e município, veja as fotos e encontre seu próximo carro. A visita é livre, sem precisar criar conta.</p></div>
        </div>
        <div class="container page-content">
          <div class="catalog-toolbar">
            <div class="catalog-count" id="catalog-count"></div>
            <div class="catalog-filters">
              <label class="filter-search"><span class="visually-hidden">Buscar veículo</span><span aria-hidden="true">⌕</span><input id="catalog-search" type="search" placeholder="Buscar marca ou modelo" /></label>
              <select id="catalog-state" aria-label="Filtrar por estado"></select>
              <select id="catalog-city" aria-label="Filtrar por município"></select>
              <select id="catalog-sort" aria-label="Ordenar veículos"><option value="featured">Em destaque</option><option value="price-asc">Menor preço</option><option value="price-desc">Maior preço</option></select>
            </div>
          </div>
          <div class="catalog-categories" id="catalog-categories" aria-label="Filtrar por categoria">
            <button class="category-filter is-active" type="button" data-category="Todos" aria-pressed="true">Todos</button>
            <button class="category-filter" type="button" data-category="Sedã" aria-pressed="false">Sedã</button>
            <button class="category-filter" type="button" data-category="Hatch" aria-pressed="false">Hatch</button>
            <button class="category-filter" type="button" data-category="SUV" aria-pressed="false">SUV</button>
            <button class="category-filter" type="button" data-category="Picape" aria-pressed="false">Picape</button>
            <button class="category-filter" type="button" data-category="Minivan" aria-pressed="false">Minivan</button>
            <button class="category-filter" type="button" data-category="Compacto" aria-pressed="false">Compactos</button>
          </div>
          <div class="row g-4" id="catalog-vehicles" aria-live="polite"></div>
        </div>
      </section>
    </main>
    <div data-layout="footer"></div>
    <div data-layout="modals"></div>
  </body>
</html>
