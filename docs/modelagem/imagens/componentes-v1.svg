<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc"><title id="title">Diagrama de componentes — V1: execução local</title><desc id="desc">Topologia implementada: navegador, JSON Server, db.json e dependências externas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#32745e"/></marker><marker id="openArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#32745e" stroke-width="1.7"/></marker></defs><rect width="100%" height="100%" fill="#fbfaf6"/><rect x="0" y="0" width="1600" height="12" fill="#ed6b3b"/><text x="48" y="58" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#20312f">Diagrama de componentes — V1: execução local</text><text x="48" y="88" font-family="Arial,sans-serif" font-size="15" fill="#64736f">Topologia implementada: navegador, JSON Server, db.json e dependências externas.</text><rect x="50" y="150" width="920" height="570" rx="18" fill="#fff" stroke="#ed6b3b" stroke-width="2.5"/><path d="M68 150h884a18 18 0 0 1 18 18v40h-920v-40a18 18 0 0 1 18-18" fill="#ed6b3b" opacity=".12"/><text x="74" y="188" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#20312f">Navegador do usuário</text><rect x="74" y="216" width="424" height="48" rx="8" fill="#fbfaf6" stroke="#dfe5df"/><text x="86" y="245" font-family="Arial,sans-serif" font-size="13" fill="#20312f">Páginas HTML: início, catálogo, cadastro e painéis</text><rect x="510" y="216" width="424" height="48" rx="8" fill="#fbfaf6" stroke="#dfe5df"/><text x="522" y="245" font-family="Arial,sans-serif" font-size="13" fill="#20312f">partials: cabeçalho, rodapé e modais</text><rect x="74" y="272" width="424" height="48" rx="8" fill="#fbfaf6" stroke="#dfe5df"/><text x="86" y="301" font-family="Arial,sans-serif" font-size="13" fill="#20312f">app.js: estado, eventos e regras</text><rect x="510" y="272" width="424" height="48" rx="8" fill="#fbfaf6" stroke="#dfe5df"/><text x="522" y="301" font-family="Arial,sans-serif" font-size="13" fill="#20312f">api.js: cliente Fetch</text><rect x="74" y="328" width="424" height="48" rx="8" fill="#fbfaf6" stroke="#dfe5df"/><text x="86" y="357" font-family="Arial,sans-serif" font-size="13" fill="#20312f">styles.css + Bootstrap</text><rect x="510" y="328" width="424" height="48" rx="8" fill="#fbfaf6" stroke="#dfe5df"/><text x="522" y="357" font-family="Arial,sans-serif" font-size="13" fill="#20312f">data/*.json e imagens locais</text><rect x="1050" y="190" width="490" height="280" rx="18" fill="#fff" stroke="#32745e" stroke-width="2.5"/><path d="M1068 190h454a18 18 0 0 1 18 18v40h-490v-40a18 18 0 0 1 18-18" fill="#32745e" opacity=".12"/><text x="1074" y="228" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#20312f">Node.js — localhost:3000</text><rect x="1074" y="256" width="430" height="48" rx="8" fill="#fbfaf6" stroke="#dfe5df"/><text x="1086" y="285" font-family="Arial,sans-serif" font-size="13" fill="#20312f">JSON Server 0.17: API REST</text><rect x="1074" y="312" width="430" height="48" rx="8" fill="#fbfaf6" stroke="#dfe5df"/><text x="1086" y="341" font-family="Arial,sans-serif" font-size="13" fill="#20312f">Serviço de arquivos estáticos</text><rect x="1050" y="525" width="490" height="195" rx="18" fill="#fff" stroke="#e7f1eb" stroke-width="2.5"/><path d="M1068 525h454a18 18 0 0 1 18 18v40h-490v-40a18 18 0 0 1 18-18" fill="#e7f1eb" opacity=".12"/><text x="1074" y="563" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#20312f">Persistência</text><rect x="1074" y="591" width="430" height="48" rx="8" fill="#fbfaf6" stroke="#dfe5df"/><text x="1086" y="620" font-family="Arial,sans-serif" font-size="13" fill="#20312f">db.json: users, clients, vehicles, requests</text><rect x="260" y="790" width="540" height="125" rx="18" fill="#fff" stroke="#eaf0f8" stroke-width="2.5"/><path d="M278 790h504a18 18 0 0 1 18 18v40h-540v-40a18 18 0 0 1 18-18" fill="#eaf0f8" opacity=".12"/><text x="284" y="828" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#20312f">Serviços externos opcionais</text><rect x="284" y="856" width="480" height="17" rx="8" fill="#fbfaf6" stroke="#dfe5df"/><text x="296" y="869.5" font-family="Arial,sans-serif" font-size="13" fill="#20312f">CDNs: Bootstrap, Google Fonts e banner</text><path d="M970 355 C1002 355,1018 315,1050 315" fill="none" stroke="#32745e" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="1010" y="325" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#64736f" paint-order="stroke" stroke="#fbfaf6" stroke-width="6">HTTP JSON</text><path d="M1295 470 C1295 470,1295 525,1295 525" fill="none" stroke="#32745e" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="1295" y="487.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#64736f" paint-order="stroke" stroke="#fbfaf6" stroke-width="6">GET / grava</text><path d="M500 720 C500 720,500 790,500 790" fill="none" stroke="#32745e" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow)"/><text x="500" y="745" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#64736f" paint-order="stroke" stroke="#fbfaf6" stroke-width="6">recursos externos</text><text x="50" y="96" font-family="Arial,sans-serif" font-size="14" fill="#64736f">Clientes, agente, empresa e banco usam o navegador; papéis e permissões existem na interface, não na API.</text></svg>